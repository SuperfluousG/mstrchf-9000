name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate the recipe catalogue
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Build the Codex plugin
        run: node scripts/build-codex.mjs

      - name: Verify the packaged stdio server
        run: node scripts/smoke-codex.mjs
