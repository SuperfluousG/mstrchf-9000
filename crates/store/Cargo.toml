[package]
name = "mstrchf-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
autotests = false

[features]
synthetic-development = []

[[test]]
name = "boundary"
path = "tests/boundary.rs"

[[test]]
name = "api_boundary"
path = "tests/api_boundary.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
mstrchf-contracts = { path = "../contracts" }
mstrchf-core = { path = "../core" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
getrandom = { version = "=0.3.4", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
