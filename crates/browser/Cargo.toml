[package]
name = "mstrchf-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
build = "build.rs"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mstrchf-contracts = { path = "../contracts" }
mstrchf-core = { path = "../core" }
mstrchf-calendar = { path = "../calendar" }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
schemars = { version = "=1.2.2", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
